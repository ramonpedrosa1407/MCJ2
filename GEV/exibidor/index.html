<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEV · Exibidor</title>
<link rel="stylesheet" href="../assets/gev-style.css">
<style>
  body { background: #0D0820; }
  .card { max-width: 600px; }
  .disco {
    width: 160px; height: 160px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #3a2a6b, #150c30 70%);
    border: 4px solid #C9A227;
    display: flex; align-items: center; justify-content: center;
    font-size: 42px;
  }
  .disco.tocando { animation: girar 4s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .disco.tocando { animation: none; } }
  h1 { font-size: clamp(22px, 6vw, 34px); }
  .nome { font-size: clamp(18px, 5vw, 26px); margin-top: 4px; min-height: 32px; }
  .estado { opacity: .55; font-size: 14px; margin-top: 6px; font-family: -apple-system, sans-serif; min-height: 20px; }
  .estado.erro { color: #FF8A8A; opacity: 1; }
  .iniciar {
    margin-top: 24px;
    padding: 16px 30px;
    background: #C9A227;
    color: #1A1033;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
  }
  .iniciar:disabled { opacity: .5; }
  .voltar { display: block; margin-top: 24px; color: rgba(244,240,255,.35); text-decoration: none; font-family: -apple-system, sans-serif; font-size: 12px; }

  /* Só aparece se o navegador barrar o som. Enquanto não barra, ninguém vê nada. */
  .liberar {
    position: fixed;
    inset: 0;
    background: rgba(13, 8, 32, .96);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    z-index: 10;
  }
  .liberar.aparecendo { display: flex; }
  .liberar .icone { font-size: 60px; }
  .liberar h2 { font-size: clamp(22px, 6vw, 30px); }
  .liberar p { font-family: -apple-system, sans-serif; font-size: 15px; opacity: .7; max-width: 34ch; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <div class="gev-nav" id="nav"></div>
  <div class="disco" id="disco">🎶</div>
  <h1>GEV</h1>
  <div class="nome" id="nome">aguardando...</div>
  <div class="estado" id="estadoTexto">conectando...</div>
  <button class="iniciar" id="iniciar" style="display:none">▶ Iniciar exibição</button>
  <a class="voltar" href="../mural/">voltar ao mural</a>
</div>

<div class="liberar" id="liberar">
  <div class="icone">🔊</div>
  <h2>Toque para liberar o som</h2>
  <p>O navegador só deixa tocar áudio depois de um toque na tela. É uma vez só — depois disso tudo acontece sozinho.</p>
</div>

<audio id="player"></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/gev-config.js"></script>
<script src="../assets/gev-common.js"></script>
<script>
var sb = GEV.sb;
var player = document.getElementById('player');
var disco = document.getElementById('disco');
var nomeEl = document.getElementById('nome');
var estadoEl = document.getElementById('estadoTexto');
var liberarEl = document.getElementById('liberar');

var faixaCarregadaId = null; // qual música está carregada no player agora
var faixaPausadaId = null;   // se pausada, qual ficou pausada (pra retomar do ponto certo)
var ultimoComando = null;    // disparado_em do último comando aplicado
var comandoPendente = null;  // comando que ficou esperando o som ser liberado

function dizer(texto, ehErro) {
  estadoEl.textContent = texto;
  estadoEl.className = ehErro ? 'estado erro' : 'estado';
}

/* ---------- liberação do som ---------- */
// Navegador nenhum toca áudio antes de um toque na tela. O "Iniciar exibição"
// resolve isso UMA vez, no começo da reunião — melhor pedir agora do que na hora
// em que a música deveria estar tocando.
//
// O jeito de destravar é tocar um som de verdade, ainda que mudo: 10ms de
// silêncio embutidos aqui. Chamar play() sem nenhuma fonte carregada devolve uma
// promessa que nunca responde, e foi exatamente isso que travava esta tela antes.

var SILENCIO = 'data:audio/wav;base64,UklGRsQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YaAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';
var somLiberado = false;
var botaoIniciar = document.getElementById('iniciar');

// Um clique no botão dispara também o ouvinte de toque da tela. Se as duas
// tentativas mexerem no player ao mesmo tempo, uma interrompe a outra e nenhuma
// funciona — por isso existe só uma tentativa em andamento por vez.
var destravamentoEmCurso = null;

function destravarSom() {
  if (somLiberado) return Promise.resolve(true);
  if (destravamentoEmCurso) return destravamentoEmCurso;

  var srcAnterior = player.getAttribute('src');
  player.src = SILENCIO;

  destravamentoEmCurso = player.play().then(function () {
    player.pause();
    player.currentTime = 0;
    somLiberado = true;
    return true;
  }).catch(function () {
    return false;
  }).then(function (ok) {
    // devolve a música que estava carregada, se havia alguma
    if (srcAnterior) player.src = srcAnterior;
    else player.removeAttribute('src');
    destravamentoEmCurso = null;
    return ok;
  });

  return destravamentoEmCurso;
}

function mostrarBotaoIniciar() {
  if (somLiberado) return;
  botaoIniciar.style.display = 'inline-block';
  botaoIniciar.disabled = false;
  dizer('toque em "Iniciar exibição" para liberar o som');
}

function esconderBotaoIniciar() {
  botaoIniciar.style.display = 'none';
  liberarEl.classList.remove('aparecendo');
}

// retoma o comando que ficou esperando o som ser liberado
function retomarPendente() {
  var pendente = comandoPendente;
  comandoPendente = null;
  if (pendente) {
    ultimoComando = null; // força reaplicar o comando que tinha sido barrado
    aplicarEstado(pendente);
  } else {
    dizer('pronto — esperando o controle remoto');
  }
}

botaoIniciar.onclick = async function () {
  botaoIniciar.disabled = true;
  dizer('liberando o som...');
  var ok = await destravarSom();
  if (!ok) {
    botaoIniciar.disabled = false;
    dizer('o navegador ainda não liberou o som. Toque de novo.', true);
    return;
  }
  esconderBotaoIniciar();
  retomarPendente();
};

// rede de segurança: se o som for barrado no meio da reunião, qualquer toque
// na tela libera e retoma o que estava esperando
function liberarPorToque() {
  if (!liberarEl.classList.contains('aparecendo')) return;
  destravarSom().then(function (ok) {
    if (!ok) return;
    esconderBotaoIniciar();
    retomarPendente();
  });
}

['click', 'touchstart', 'keydown'].forEach(function (evento) {
  document.addEventListener(evento, liberarPorToque, { passive: true });
});

function pedirLiberacao() {
  liberarEl.classList.add('aparecendo');
}

function tocarComAviso(row) {
  player.play().then(function () {
    somLiberado = true;
    esconderBotaoIniciar();
    comandoPendente = null;
  }).catch(function (e) {
    if (e && e.name === 'NotAllowedError') {
      comandoPendente = row;
      somLiberado = false;
      pedirLiberacao();
      dizer('esperando liberar o som', true);
      return;
    }
    dizer('Não consegui tocar: ' + ((e && e.message) || 'erro desconhecido'), true);
  });
}

player.addEventListener('error', function () {
  if (!player.src) return; // sem música carregada não é erro de verdade
  var codigos = {
    1: 'carregamento interrompido',
    2: 'falha de rede',
    3: 'não consegui decodificar o arquivo',
    4: 'formato não suportado'
  };
  dizer('Problema com o arquivo: ' + (player.error ? (codigos[player.error.code] || 'erro ' + player.error.code) : 'erro desconhecido'), true);
});

/* ---------- sinal de vida ---------- */

// Duas telas de Exibidor abertas = som dobrado. E uma aba antiga que perdeu a
// conexão continua tocando a música velha, no volume velho. Por isso só a tela
// aberta mais recentemente fica no comando; as outras se calam.
var MEU_ID = 'exib-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
var souODono = true;

function avisarQueEstouVivo(extras) {
  if (!souODono) return Promise.resolve({});
  var dados = {
    exibidor_visto_em: new Date().toISOString(),
    // "aberto" e "tocando" são coisas diferentes: o som pode não ter começado
    exibidor_tocando: !player.paused && !player.ended
  };
  if (extras) for (var k in extras) dados[k] = extras[k];
  return sb.from('gev_estado').update(dados).eq('id', 'atual');
}

function assumirOComando() {
  souODono = true;
  return sb.from('gev_estado').update({
    exibidor_id: MEU_ID,
    exibidor_visto_em: new Date().toISOString(),
    exibidor_tocando: false
  }).eq('id', 'atual');
}

// devolve true se esta tela continua no comando
function conferirSeAindaSouODono(row) {
  if (!row.exibidor_id || row.exibidor_id === MEU_ID) {
    souODono = true;
    return true;
  }
  // outra tela assumiu: esta se cala na hora
  if (souODono) {
    souODono = false;
    player.pause();
    player.removeAttribute('src');
    player.load();
    faixaCarregadaId = null;
    faixaPausadaId = null;
    comandoPendente = null;
    disco.classList.remove('tocando');
    esconderBotaoIniciar();
    nomeEl.textContent = 'em silêncio';
    dizer('outra tela assumiu a exibição — o som está saindo lá. Recarregue esta página para trazer o som de volta para cá.', true);
  }
  return false;
}

['play', 'pause', 'ended', 'stalled', 'waiting'].forEach(function (evento) {
  player.addEventListener(evento, function () { avisarQueEstouVivo().then(function () {}); });
});

// posição atual, pro Controle remoto mostrar a barrinha de progresso
var ultimoEnvioPosicao = 0;
player.addEventListener('timeupdate', function () {
  var agora = Date.now();
  if (agora - ultimoEnvioPosicao < 1000) return; // no máx 1x por segundo
  ultimoEnvioPosicao = agora;
  if (!faixaCarregadaId) return;
  avisarQueEstouVivo({
    posicao_segundos: player.currentTime || 0,
    duracao_segundos: isFinite(player.duration) ? player.duration : 0
  }).then(function () {});
});

/* ---------- aplicar o que o Controle remoto mandou ---------- */

function aplicarEstado(row) {
  if (!row) return;
  if (!conferirSeAindaSouODono(row)) return;
  nomeEl.textContent = row.musica_nome || 'aguardando...';
  player.volume = (row.volume === null || row.volume === undefined) ? 1 : Number(row.volume);
  player.loop = !!row.repetir;

  var comandoNovo = row.disparado_em !== ultimoComando;

  if (row.acao === 'play' && row.musica_path) {
    if (!comandoNovo && row.musica_id === faixaCarregadaId && faixaPausadaId === null) {
      // já está tocando essa mesma música — só mudou volume/repetir, não mexe no player
    } else if (row.musica_id === faixaCarregadaId && faixaPausadaId === row.musica_id) {
      // mesma música que estava pausada -> retoma do ponto onde parou
      faixaPausadaId = null;
      tocarComAviso(row);
    } else {
      // música nova (ou reiniciando de propósito) -> toca do começo
      player.src = GEV.publicUrlAudio(row.musica_path);
      player.currentTime = 0;
      faixaCarregadaId = row.musica_id;
      faixaPausadaId = null;
      tocarComAviso(row);
    }
    disco.classList.add('tocando');
    if (!comandoPendente) dizer(row.repetir ? 'tocando agora · 🔁 repetindo' : 'tocando agora');
  } else if (row.acao === 'pause') {
    if (comandoNovo || faixaPausadaId !== faixaCarregadaId) {
      player.pause();
      faixaPausadaId = faixaCarregadaId;
    }
    disco.classList.remove('tocando');
    dizer('pausado');
  } else {
    if (comandoNovo || faixaCarregadaId !== null) {
      player.pause();
      player.removeAttribute('src');
      player.load();
      faixaCarregadaId = null;
      faixaPausadaId = null;
    }
    disco.classList.remove('tocando');
    comandoPendente = null;
    liberarEl.classList.remove('aparecendo');
    // enquanto o som não estiver liberado, a tela continua pedindo o toque
    if (somLiberado) dizer('pronto — esperando o controle remoto');
    else mostrarBotaoIniciar();
  }

  ultimoComando = row.disparado_em;
}

/* ---------- conexão (sozinha, sem depender de ninguém) ---------- */

async function conectar() {
  // ao abrir, esta tela assume o comando — qualquer outra que esteja aberta se cala
  await assumirOComando();

  // tenta liberar o som sozinho; se o navegador não deixar, aí sim pede o toque
  var jaLiberado = await destravarSom();
  if (!jaLiberado) mostrarBotaoIniciar();

  var estadoR = await sb.from('gev_estado').select('*').eq('id', 'atual').maybeSingle();
  if (estadoR.data) {
    aplicarEstado(estadoR.data);
  } else if (jaLiberado) {
    dizer('pronto — esperando o controle remoto');
  }

  sb.channel('gev_estado_mudou')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'gev_estado' }, function (payload) {
      aplicarEstado(payload.new);
    })
    .subscribe();

  // rede de segurança: mesmo que o tempo real falhe, confere o estado periodicamente
  setInterval(async function () {
    var r = await sb.from('gev_estado').select('*').eq('id', 'atual').maybeSingle();
    if (r.data) aplicarEstado(r.data);
  }, 3000);

  // enquanto esta tela estiver aberta, avisa que está de pé
  setInterval(function () {
    if (player.paused) avisarQueEstouVivo().then(function () {});
  }, 5000);
}

GEV.exigirMidia('completo').then(function (perfil) {
  if (!perfil) return;
  GEV.montarNav('nav', 'exibidor/', perfil);
  conectar().catch(function (e) {
    dizer('Não consegui conectar: ' + ((e && e.message) || 'erro desconhecido'), true);
  });
});
</script>
</body>
</html>

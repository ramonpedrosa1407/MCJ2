<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grupo Evoluir · Exibidor</title>
<link rel="stylesheet" href="../assets/gev-style.css">
<style>
  body { background: #0D0820; }
  .card { max-width: 600px; }
  .disco {
    width: 160px; height: 160px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #3a2a6b, #150c30 70%);
    border: 4px solid #C9A227;
    display: flex; align-items: center; justify-content: center;
    font-size: 42px;
  }
  .disco.tocando { animation: girar 4s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  h1 { font-size: clamp(22px, 6vw, 34px); }
  .nome { font-size: clamp(18px, 5vw, 26px); margin-top: 4px; min-height: 32px; }
  .estado { opacity: .55; font-size: 14px; margin-top: 6px; font-family: -apple-system, sans-serif; }
  .iniciar {
    margin-top: 28px;
    padding: 16px 28px;
    background: #C9A227;
    color: #1A1033;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
  }
  .voltar { display: block; margin-top: 24px; color: rgba(244,240,255,.35); text-decoration: none; font-family: -apple-system, sans-serif; font-size: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="gev-nav" id="nav"></div>
  <div class="disco" id="disco">🎶</div>
  <h1>Grupo Evoluir</h1>
  <div class="nome" id="nome">aguardando...</div>
  <div class="estado" id="estadoTexto">toque em "iniciar exibição" para ativar o som</div>
  <button class="iniciar" id="iniciar">▶ Iniciar exibição</button>
  <a class="voltar" href="../mural/">voltar ao mural</a>
</div>

<audio id="player"></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/gev-config.js"></script>
<script src="../assets/gev-common.js"></script>
<script>
var sb = GEV.sb;
var player = document.getElementById('player');
var disco = document.getElementById('disco');
var nomeEl = document.getElementById('nome');
var estadoEl = document.getElementById('estadoTexto');
var faixaCarregadaId = null; // qual música está carregada no player agora
var faixaPausadaId = null;   // se pausada, qual música ficou pausada (pra retomar do ponto certo)
var ativo = false;
var ultimoComando = null; // disparado_em do último comando já aplicado — evita reiniciar a música à toa

// Tocar pode falhar (navegador bloqueou, arquivo com problema, aparelho no mudo).
// Antes o erro era engolido em silencio e a tela ficava parada sem explicacao.
function tocarComAviso() {
  player.play().then(function () {
    if (estadoEl.dataset.erro) {
      delete estadoEl.dataset.erro;
      estadoEl.style.color = '';
    }
  }).catch(function (e) {
    estadoEl.dataset.erro = '1';
    estadoEl.style.color = '#FF8A8A';
    estadoEl.textContent = 'Não consegui tocar: ' + (e && e.name === 'NotAllowedError'
      ? 'o navegador bloqueou o som. Toque em "Iniciar exibição" de novo.'
      : (e && e.message) || 'erro desconhecido');
  });
}

player.addEventListener('error', function () {
  var codigos = { 1: 'carregamento interrompido', 2: 'falha de rede', 3: 'não consegui decodificar o arquivo', 4: 'formato não suportado' };
  estadoEl.dataset.erro = '1';
  estadoEl.style.color = '#FF8A8A';
  estadoEl.textContent = 'Problema com o arquivo: ' + (player.error ? (codigos[player.error.code] || 'erro ' + player.error.code) : 'erro desconhecido');
});

function aplicarEstado(row) {
  if (!row) return;
  nomeEl.textContent = row.musica_nome || 'aguardando...';
  player.volume = (row.volume === null || row.volume === undefined) ? 1 : Number(row.volume);
  player.loop = !!row.repetir;

  var comandoNovo = row.disparado_em !== ultimoComando;

  if (row.acao === 'play' && row.musica_path) {
    if (!comandoNovo && row.musica_id === faixaCarregadaId && faixaPausadaId === null) {
      // já está tocando essa mesma música — foi só um update de volume/repetir, não mexe no player
    } else if (row.musica_id === faixaCarregadaId && faixaPausadaId === row.musica_id) {
      // mesma música que estava pausada -> retoma do ponto onde parou
      faixaPausadaId = null;
      tocarComAviso();
    } else {
      // música nova (ou reiniciando de propósito) -> toca do começo
      player.src = GEV.publicUrlAudio(row.musica_path);
      player.currentTime = 0;
      tocarComAviso();
      faixaCarregadaId = row.musica_id;
      faixaPausadaId = null;
    }
    disco.classList.add('tocando');
    estadoEl.textContent = row.repetir ? 'tocando agora · 🔁 repetindo' : 'tocando agora';
  } else if (row.acao === 'pause') {
    if (comandoNovo || faixaPausadaId !== faixaCarregadaId) {
      player.pause();
      faixaPausadaId = faixaCarregadaId;
    }
    disco.classList.remove('tocando');
    estadoEl.textContent = 'pausado';
  } else {
    if (comandoNovo || faixaCarregadaId !== null) {
      player.pause();
      player.currentTime = 0;
      faixaCarregadaId = null;
      faixaPausadaId = null;
    }
    disco.classList.remove('tocando');
    estadoEl.textContent = 'parado';
  }

  ultimoComando = row.disparado_em;
}

// Avisa o Controle remoto que esta tela está aberta e pronta para tocar.
// Sem esse sinal, o controle não tem como saber se existe alguém do outro lado.
function avisarQueEstouVivo(extras) {
  var dados = {
    exibidor_visto_em: new Date().toISOString(),
    // "aberto" e "tocando" são coisas diferentes: o som pode não ter começado
    exibidor_tocando: !player.paused && !player.ended
  };
  if (extras) for (var k in extras) dados[k] = extras[k];
  return sb.from('gev_estado').update(dados).eq('id', 'atual');
}

// qualquer mudança real do player é avisada na hora
['play', 'pause', 'ended', 'stalled', 'waiting'].forEach(function (evento) {
  player.addEventListener(evento, function () { avisarQueEstouVivo().then(function () {}); });
});

// envia a posição atual pro Controle remoto poder mostrar a barrinha de progresso
var ultimoEnvioPosicao = 0;
player.addEventListener('timeupdate', function () {
  var agora = Date.now();
  if (agora - ultimoEnvioPosicao < 1000) return; // no máx 1x por segundo
  ultimoEnvioPosicao = agora;
  if (!faixaCarregadaId) return;
  avisarQueEstouVivo({
    posicao_segundos: player.currentTime || 0,
    duracao_segundos: isFinite(player.duration) ? player.duration : 0
  }).then(function () {});
});

document.getElementById('iniciar').onclick = async function () {
  if (ativo) return;
  ativo = true;
  // gesto do usuário libera o áudio no navegador — necessário só uma vez
  player.muted = true;
  await player.play().catch(function () {});
  player.pause();
  player.muted = false;
  this.style.display = 'none';
  estadoEl.textContent = 'conectado — aguardando disparo remoto';

  await avisarQueEstouVivo();

  var estadoR = await sb.from('gev_estado').select('*').eq('id', 'atual').maybeSingle();
  if (estadoR.data) aplicarEstado(estadoR.data);

  sb.channel('gev_estado_mudou')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'gev_estado' }, function (payload) {
      aplicarEstado(payload.new);
    })
    .subscribe(function (status) {
      if (status === 'SUBSCRIBED') {
        estadoEl.textContent = faixaCarregadaId ? estadoEl.textContent : 'conectado — aguardando disparo remoto';
      }
    });

  // rede de segurança: mesmo que o tempo real falhe, confere o estado periodicamente
  setInterval(async function () {
    var r = await sb.from('gev_estado').select('*').eq('id', 'atual').maybeSingle();
    if (r.data) aplicarEstado(r.data);
  }, 3000);

  // enquanto esta tela estiver aberta, avisa que está de pé (mesmo parado)
  setInterval(function () {
    if (player.paused) avisarQueEstouVivo().then(function () {});
  }, 5000);

  // Se esta aba for fechada, o sinal de vida simplesmente para de chegar e o
  // Controle remoto considera o exibidor sumido depois de 15s.
};

GEV.exigirAcesso(['master', 'coordenador']).then(function (perfil) {
  if (perfil) GEV.montarNav('nav', 'exibidor/', perfil);
});
</script>
</body>
</html>

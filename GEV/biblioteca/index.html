<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grupo Evoluir · Biblioteca</title>
<link rel="stylesheet" href="../assets/gev-style.css">
<style>
  body { align-items: flex-start; }
  .card { max-width: 640px; text-align: left; margin-top: 24px; }
  h1 { text-align: center; }
  .sub { text-align: center; }
  .voltar { display: inline-block; margin-bottom: 18px; color: rgba(244,240,255,.6); text-decoration: none; font-family: -apple-system, sans-serif; font-size: 14px; }
  .caixa-upload {
    border: 2px dashed rgba(255,255,255,.25);
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    margin-bottom: 24px;
  }
  .caixa-upload input[type=file] { display: none; }
  .caixa-upload label {
    display: inline-block;
    padding: 12px 20px;
    background: #C9A227;
    color: #1A1033;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    font-family: -apple-system, sans-serif;
  }
  .status { font-size: 13px; opacity: .7; margin-top: 10px; min-height: 18px; font-family: -apple-system, sans-serif; }
  ul.lista { list-style: none; }
  li.item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px;
    border-radius: 10px;
    background: rgba(255,255,255,.05);
    margin-bottom: 8px;
  }
  li.item input[type=text] {
    flex: 1;
    padding: 8px 10px;
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.06);
    color: #F4F0FF;
    font-family: -apple-system, sans-serif;
  }
  li.item button {
    padding: 8px 10px;
    background: rgba(255,255,255,.1);
    color: #F4F0FF;
    font-size: 13px;
  }
  li.item button.salvar { background: #4CAF7D; color: #06210F; }
  li.item button.excluir { background: #7A2E2E; color: #FFD9D9; }
  .vazio { opacity: .5; font-size: 14px; font-family: -apple-system, sans-serif; text-align: center; padding: 20px 0; }
</style>
</head>
<body>
<div class="card">
  <a class="voltar" href="../">&larr; voltar ao menu</a>
  <div class="gev-nav">
    <a href="../biblioteca/" class="ativo">🎵 Biblioteca</a>
    <a href="../disparador/">📲 Disparador</a>
    <a href="../mural/">🗓️ Mural</a>
    <a href="../exibidor/">🔊 Exibidor</a>
  </div>
  <h1>Biblioteca</h1>
  <p class="sub">Suba os arquivos e renomeie como quiser</p>

  <div class="caixa-upload">
    <label for="arquivo">Escolher música (mp3)</label>
    <input type="file" id="arquivo" accept="audio/*" multiple>
    <div class="status" id="status"></div>
  </div>

  <ul class="lista" id="lista"></ul>
  <p class="vazio" id="vazio" style="display:none">Nenhuma música ainda. Suba a primeira acima.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/gev-config.js"></script>
<script src="../assets/gev-common.js"></script>
<script>
var sb = GEV.sb;
var listaEl = document.getElementById('lista');
var vazioEl = document.getElementById('vazio');
var statusEl = document.getElementById('status');

async function carregar() {
  var r = await sb.from('gev_musicas').select('*').order('ordem', { ascending: true });
  var musicas = r.data || [];
  listaEl.innerHTML = '';
  vazioEl.style.display = musicas.length ? 'none' : 'block';
  musicas.forEach(function (m) {
    var li = document.createElement('li');
    li.className = 'item';
    li.innerHTML =
      '<input type="text" value="' + m.nome_exibicao.replace(/"/g, '&quot;') + '">' +
      '<button class="salvar">Salvar</button>' +
      '<button class="excluir">Excluir</button>';
    var input = li.querySelector('input');
    li.querySelector('.salvar').onclick = async function () {
      await sb.from('gev_musicas').update({ nome_exibicao: input.value.trim() || m.nome_arquivo }).eq('id', m.id);
      statusEl.textContent = 'Nome atualizado.';
      setTimeout(function () { statusEl.textContent = ''; }, 2000);
    };
    li.querySelector('.excluir').onclick = async function () {
      if (!confirm('Excluir "' + m.nome_exibicao + '"?')) return;
      await sb.from('gev_musicas').delete().eq('id', m.id);
      await sb.storage.from(GEV_CONFIG.bucketAudio).remove([m.storage_path]);
      carregar();
    };
    listaEl.appendChild(li);
  });
}

document.getElementById('arquivo').addEventListener('change', async function (e) {
  var arquivos = Array.from(e.target.files || []);
  if (!arquivos.length) return;
  var existentesR = await sb.from('gev_musicas').select('ordem').order('ordem', { ascending: false }).limit(1);
  var existentes = existentesR.data || [];
  var proximaOrdem = existentes.length ? existentes[0].ordem + 1 : 0;

  for (var i = 0; i < arquivos.length; i++) {
    var f = arquivos[i];
    statusEl.textContent = 'Enviando "' + f.name + '"... (' + (i + 1) + '/' + arquivos.length + ')';
    var path = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '-' + f.name;
    var up = await sb.storage.from(GEV_CONFIG.bucketAudio).upload(path, f, { contentType: f.type || 'audio/mpeg' });
    if (up.error) {
      statusEl.textContent = 'Erro ao enviar "' + f.name + '": ' + up.error.message;
      return;
    }
    var nomeSemExtensao = f.name.replace(/\.[^/.]+$/, '');
    var ins = await sb.from('gev_musicas').insert({
      storage_path: path,
      nome_arquivo: f.name,
      nome_exibicao: nomeSemExtensao,
      ordem: proximaOrdem++
    });
    if (ins.error) {
      statusEl.textContent = 'Erro ao salvar "' + f.name + '": ' + ins.error.message;
      return;
    }
  }
  statusEl.textContent = 'Pronto!';
  e.target.value = '';
  carregar();
});

GEV.exigirAcesso(['master', 'coordenador']).then(function (perfil) {
  if (perfil) carregar();
});
</script>
</body>
</html>

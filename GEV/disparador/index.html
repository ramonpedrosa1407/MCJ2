<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grupo Evoluir · Controle remoto</title>
<link rel="stylesheet" href="../assets/gev-style.css">
<style>
  body { align-items: flex-start; }
  .card { max-width: 480px; text-align: left; margin-top: 20px; }
  h1 { text-align: center; }
  .sub { text-align: center; }

  /* Dois blocos separados: em cima o que está tocando e os controles,
     embaixo a escolha da faixa. */
  .bloco {
    padding: 16px;
    border-radius: 16px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.12);
    margin-bottom: 16px;
  }
  .bloco:last-of-type { margin-bottom: 0; }
  .titulo-bloco {
    font-family: -apple-system, sans-serif;
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    opacity: .45;
    margin-bottom: 12px;
  }
  .voltar { display: inline-block; margin-bottom: 14px; color: rgba(244,240,255,.6); text-decoration: none; font-family: -apple-system, sans-serif; font-size: 14px; }

  .exibidor-estado {
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    border-radius: 10px;
    padding: 11px 14px;
    margin-bottom: 16px;
    line-height: 1.45;
    text-align: left;
  }
  .exibidor-estado.ligado {
    background: rgba(76,175,125,.14);
    border: 1px solid rgba(76,175,125,.4);
    color: #8FE3B4;
  }
  .exibidor-estado.desligado {
    background: rgba(255,138,138,.1);
    border: 1px solid rgba(255,138,138,.38);
    color: #FFB3B3;
  }
  .exibidor-estado a { color: inherit; font-weight: bold; }
  .parar-tudo {
    width: 100%;
    padding: 14px;
    margin-bottom: 18px;
    background: #7A2E2E;
    color: #FFD9D9;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
  }
  .controles {
    display: flex;
    gap: 10px;
  }
  .volume, .repetir {
    padding: 14px 16px;
    border-radius: 12px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.15);
    font-family: -apple-system, sans-serif;
  }
  .volume { flex: 1; }
  .volume .linha { display: flex; align-items: center; gap: 10px; }
  .volume label { font-size: 13px; opacity: .7; white-space: nowrap; }
  .volume input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 6px;
    border-radius: 4px;
    background: rgba(255,255,255,.2);
  }
  .volume input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #C9A227;
    cursor: pointer;
  }
  .volume input[type=range]::-moz-range-thumb {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #C9A227;
    border: none;
    cursor: pointer;
  }
  .volume .valor { font-size: 14px; width: 42px; text-align: right; }
  .repetir { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .repetir input { width: 20px; height: 20px; }
  .repetir span { font-size: 13px; opacity: .8; }
  .repetir.ativo { background: rgba(201,162,39,.18); border-color: #C9A227; }
  .repetir.ativo span { opacity: 1; color: #E8C86A; }

  ul.lista { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  li.faixa {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px;
    border-radius: 12px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.15);
  }
  li.faixa.tocando { background: #2E5A3E; border-color: #4CAF7D; }
  li.faixa.pausada { background: #4A3C1A; border-color: #C9A227; }
  li.faixa .nome { flex: 1; font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li.faixa .estadinho { font-size: 11px; opacity: .7; font-family: -apple-system, sans-serif; display: block; margin-top: 2px; }
  li.faixa .botoes { display: flex; gap: 6px; }
  li.faixa button {
    width: 42px; height: 42px;
    border-radius: 10px;
    background: rgba(255,255,255,.1);
    color: #F4F0FF;
    font-size: 16px;
    flex-shrink: 0;
  }
  li.faixa button:disabled { opacity: .25; }
  li.faixa button.b-play:not(:disabled) { background: #4CAF7D; color: #06210F; }
  li.faixa button.b-pause:not(:disabled) { background: #C9A227; color: #1A1033; }
  li.faixa button.b-stop:not(:disabled) { background: #7A2E2E; color: #FFD9D9; }
  .vazio { opacity: .5; font-size: 14px; font-family: -apple-system, sans-serif; text-align: center; padding: 12px 0; }

  .tocando-agora {
    padding: 14px 16px;
    border-radius: 12px;
    background: #2E5A3E;
    border: 1px solid #4CAF7D;
    margin-bottom: 14px;
    font-family: -apple-system, sans-serif;
  }
  .ta-nome { font-size: 15px; font-weight: bold; margin-bottom: 8px; }
  .ta-barra {
    width: 100%;
    height: 8px;
    border-radius: 4px;
    background: rgba(255,255,255,.15);
    overflow: hidden;
  }
  .ta-progresso { height: 100%; width: 0%; background: #C9A227; border-radius: 4px; transition: width .3s linear; }
  .ta-tempo { display: flex; justify-content: space-between; font-size: 12px; opacity: .75; margin-top: 6px; }
</style>
</head>
<body>
<div class="card">
  <a class="voltar" href="../mural/">&larr; voltar ao mural</a>
  <div class="gev-nav" id="nav"></div>
  <h1>Controle remoto</h1>
  <p class="sub">▶ toca · ⏸ pausa · ⏹ para</p>

  <div class="exibidor-estado" id="exibidorEstado"></div>

  <div class="bloco">
    <div class="titulo-bloco">Controles</div>

    <div class="tocando-agora" id="tocandoAgora" style="display:none">
      <div class="ta-nome" id="taNome"></div>
      <div class="ta-barra"><div class="ta-progresso" id="taProgresso"></div></div>
      <div class="ta-tempo"><span id="taAtual">0:00</span><span id="taTotal">0:00</span></div>
    </div>

    <button class="parar-tudo" id="pararTudo">⏹ PARAR TUDO</button>

    <div class="controles">
      <div class="volume">
        <div class="linha">
          <label>🔉 Volume</label>
          <input type="range" id="volume" min="0" max="100" value="100">
          <span class="valor" id="volumeValor">100%</span>
        </div>
      </div>
      <label class="repetir" id="repetirCaixa">
        <input type="checkbox" id="repetir">
        <span>🔁 Repetir</span>
      </label>
    </div>
  </div>

  <div class="bloco">
    <div class="titulo-bloco">Escolha a faixa</div>
    <ul class="lista" id="lista"></ul>
    <p class="vazio" id="vazio" style="display:none">Nenhuma música na biblioteca ainda.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/gev-config.js"></script>
<script src="../assets/gev-common.js"></script>
<script>
var sb = GEV.sb;
var listaEl = document.getElementById('lista');
var vazioEl = document.getElementById('vazio');
var volumeEl = document.getElementById('volume');
var volumeValorEl = document.getElementById('volumeValor');
var repetirEl = document.getElementById('repetir');
var repetirCaixaEl = document.getElementById('repetirCaixa');
var arrastandoVolume = false;
var mexendoRepetir = false;
var estadoAtual = null;
var estadoBuscadoEm = 0;

var exibidorEstadoEl = document.getElementById('exibidorEstado');
var tocandoAgoraEl = document.getElementById('tocandoAgora');
var taNomeEl = document.getElementById('taNome');
var taProgressoEl = document.getElementById('taProgresso');
var taAtualEl = document.getElementById('taAtual');
var taTotalEl = document.getElementById('taTotal');

function formatarTempo(segundos) {
  segundos = Math.max(0, Math.floor(segundos || 0));
  var m = Math.floor(segundos / 60);
  var s = segundos % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

// O Exibidor avisa de tempos em tempos que está aberto. Se o último aviso for
// velho, não tem ninguém do outro lado para tocar o som.
var SEGUNDOS_ATE_CONSIDERAR_SUMIDO = 15;
var ultimoTempoMostrado = 0;
var faixaDoRelogio = null;

function exibidorEstaConectado() {
  if (!estadoAtual || !estadoAtual.exibidor_visto_em) return false;
  var idade = (Date.now() - new Date(estadoAtual.exibidor_visto_em).getTime()) / 1000;
  return idade < SEGUNDOS_ATE_CONSIDERAR_SUMIDO;
}

function exibidorEstaTocando() {
  return exibidorEstaConectado() && !!estadoAtual.exibidor_tocando;
}

function renderExibidorEstado() {
  if (!exibidorEstaConectado()) {
    exibidorEstadoEl.className = 'exibidor-estado desligado';
    exibidorEstadoEl.textContent = '🔇 Nenhum exibidor conectado. Abra o Exibidor na tela que vai ser compartilhada e toque em "Iniciar exibição" — sem isso não sai som em lugar nenhum.';
    return;
  }
  // aberto, mas mandamos tocar e o som não começou
  if (estadoAtual.acao === 'play' && !estadoAtual.exibidor_tocando) {
    exibidorEstadoEl.className = 'exibidor-estado desligado';
    exibidorEstadoEl.textContent = '⚠️ O exibidor está aberto, mas o som não começou. Confira o volume do aparelho e a mensagem que aparece na tela do exibidor.';
    return;
  }
  exibidorEstadoEl.className = 'exibidor-estado ligado';
  exibidorEstadoEl.textContent = estadoAtual.exibidor_tocando
    ? '🔊 Exibidor tocando — o som está saindo na tela dele.'
    : '🔊 Exibidor conectado, pronto para tocar.';
}

function renderTocandoAgora() {
  renderExibidorEstado();

  if (!estadoAtual || estadoAtual.acao === 'stop') {
    tocandoAgoraEl.style.display = 'none';
    return;
  }
  tocandoAgoraEl.style.display = 'block';
  taNomeEl.textContent = (estadoAtual.acao === 'pause' ? '⏸ ' : '▶ ') + (estadoAtual.musica_nome || '');

  var total = Number(estadoAtual.duracao_segundos) || 0;
  var atual = Number(estadoAtual.posicao_segundos) || 0;

  // Só dá para adiantar o relógio se existe um exibidor realmente tocando.
  // Sem isso a posição fica sempre em zero e o contador subia e zerava sozinho.
  if (estadoAtual.acao === 'play' && exibidorEstaTocando()) {
    atual += (Date.now() - estadoBuscadoEm) / 1000;
  }
  if (total > 0) atual = Math.min(atual, total);

  if (!exibidorEstaTocando() && estadoAtual.acao === 'play') {
    taProgressoEl.style.width = '0%';
    taAtualEl.textContent = '--:--';
    taTotalEl.textContent = '--:--';
    return;
  }

  // O relógio local corre à frente e recuaria ao chegar a posição real do
  // exibidor. Dentro da mesma faixa, o tempo mostrado nunca anda para trás.
  var faixaAgora = String(estadoAtual.musica_id) + '|' + String(estadoAtual.disparado_em);
  if (faixaAgora !== faixaDoRelogio) {
    faixaDoRelogio = faixaAgora;
    ultimoTempoMostrado = 0;
  }
  atual = Math.max(atual, ultimoTempoMostrado);
  ultimoTempoMostrado = atual;

  taProgressoEl.style.width = (total > 0 ? (atual / total * 100) : 0) + '%';
  taAtualEl.textContent = formatarTempo(atual);
  taTotalEl.textContent = formatarTempo(total);
}

setInterval(renderTocandoAgora, 500);

async function carregar() {
  var musicasR = await sb.from('gev_musicas').select('*').order('ordem', { ascending: true });
  var musicas = musicasR.data || [];
  var estadoR = await sb.from('gev_estado').select('*').eq('id', 'atual').maybeSingle();
  var estado = estadoR.data || {};
  estadoAtual = estadoR.data || null;
  estadoBuscadoEm = Date.now();
  renderTocandoAgora();

  if (!arrastandoVolume) {
    var pct = Math.round((estado.volume === null || estado.volume === undefined ? 1 : estado.volume) * 100);
    volumeEl.value = pct;
    volumeValorEl.textContent = pct + '%';
  }
  if (!mexendoRepetir) {
    repetirEl.checked = !!estado.repetir;
    repetirCaixaEl.classList.toggle('ativo', !!estado.repetir);
  }

  listaEl.innerHTML = '';
  vazioEl.style.display = musicas.length ? 'none' : 'block';
  musicas.forEach(function (m) {
    var ativa = estado.musica_id === m.id;
    var tocando = ativa && estado.acao === 'play';
    var pausada = ativa && estado.acao === 'pause';

    var li = document.createElement('li');
    li.className = 'faixa' + (tocando ? ' tocando' : '') + (pausada ? ' pausada' : '');

    var nomeDiv = document.createElement('div');
    nomeDiv.className = 'nome';
    nomeDiv.textContent = m.nome_exibicao;
    var estadinho = document.createElement('span');
    estadinho.className = 'estadinho';
    estadinho.textContent = tocando ? '▶ tocando' : pausada ? '⏸ pausada' : '';
    nomeDiv.appendChild(estadinho);

    var botoes = document.createElement('div');
    botoes.className = 'botoes';

    var bPlay = document.createElement('button');
    bPlay.className = 'b-play';
    bPlay.textContent = '▶';
    bPlay.title = 'Tocar';
    bPlay.onclick = function () { tocar(m); };

    var bPause = document.createElement('button');
    bPause.className = 'b-pause';
    bPause.textContent = '⏸';
    bPause.title = 'Pausar';
    bPause.disabled = !tocando;
    bPause.onclick = function () { pausar(m); };

    var bStop = document.createElement('button');
    bStop.className = 'b-stop';
    bStop.textContent = '⏹';
    bStop.title = 'Parar';
    bStop.disabled = !ativa;
    bStop.onclick = function () { parar(m); };

    botoes.appendChild(bPlay);
    botoes.appendChild(bPause);
    botoes.appendChild(bStop);

    li.appendChild(nomeDiv);
    li.appendChild(botoes);
    listaEl.appendChild(li);
  });
}

async function tocar(m) {
  await sb.from('gev_estado').update({
    musica_id: m.id,
    musica_path: m.storage_path,
    musica_nome: m.nome_exibicao,
    acao: 'play',
    posicao_segundos: 0,
    duracao_segundos: 0,
    disparado_em: new Date().toISOString()
  }).eq('id', 'atual');
  carregar();
}

async function pausar(m) {
  await sb.from('gev_estado').update({ acao: 'pause', disparado_em: new Date().toISOString() }).eq('id', 'atual');
  carregar();
}

async function parar(m) {
  await sb.from('gev_estado').update({ acao: 'stop', posicao_segundos: 0, disparado_em: new Date().toISOString() }).eq('id', 'atual');
  carregar();
}

var volumeTimeout = null;
volumeEl.addEventListener('input', function () {
  arrastandoVolume = true;
  volumeValorEl.textContent = volumeEl.value + '%';
  clearTimeout(volumeTimeout);
  volumeTimeout = setTimeout(async function () {
    await sb.from('gev_estado').update({ volume: Number(volumeEl.value) / 100 }).eq('id', 'atual');
    arrastandoVolume = false;
  }, 150);
});

repetirEl.addEventListener('change', async function () {
  mexendoRepetir = true;
  repetirCaixaEl.classList.toggle('ativo', repetirEl.checked);
  await sb.from('gev_estado').update({ repetir: repetirEl.checked }).eq('id', 'atual');
  mexendoRepetir = false;
  carregar();
});

document.getElementById('pararTudo').onclick = async function () {
  await sb.from('gev_estado').update({ acao: 'stop', posicao_segundos: 0, disparado_em: new Date().toISOString() }).eq('id', 'atual');
  carregar();
};

GEV.exigirMidia('controle').then(function (perfil) {
  if (perfil) {
    GEV.montarNav('nav', 'disparador/', perfil);
    carregar();
    setInterval(carregar, 4000); // rede instável no celular -> reforça o estado periodicamente

    sb.channel('gev_estado_disparador')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'gev_estado' }, function (payload) {
        var novo = payload.new;
        var comandoMudou = !estadoAtual || novo.disparado_em !== estadoAtual.disparado_em || novo.musica_id !== estadoAtual.musica_id;
        estadoAtual = novo;
        estadoBuscadoEm = Date.now();
        if (comandoMudou) {
          carregar();
        } else {
          renderTocandoAgora();
        }
      })
      .subscribe();
  }
});
</script>
</body>
</html>

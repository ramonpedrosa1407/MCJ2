<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grupo Evoluir</title>
<link rel="stylesheet" href="assets/gev-style.css">
</head>
<body>
<div class="card" id="tela-login">
  <h1>Grupo Evoluir</h1>
  <p class="sub">Música ao vivo para as reuniões</p>
  <input type="text" id="usuario" placeholder="Seu usuário" autocomplete="username" autocapitalize="none">
  <div style="height:10px"></div>
  <input type="password" id="senha" placeholder="Sua senha" autocomplete="current-password">
  <button class="btn-primary" id="entrar">Entrar</button>
  <p class="erro" id="erro"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/gev-config.js"></script>
<script src="assets/gev-common.js"></script>
<script>
var erroEl = document.getElementById('erro');

// quem já está logado vai direto para o mural — ele é a página inicial do GEV
async function irParaMuralSeLogado() {
  var perfil = await GEV.getPerfil();
  if (!perfil) return;
  window.location.replace('mural/');
}

async function tentarEntrar() {
  erroEl.textContent = '';
  var usuario = document.getElementById('usuario').value.trim();
  var senha = document.getElementById('senha').value;
  if (!usuario || !senha) {
    erroEl.textContent = 'Preencha usuário e senha.';
    return;
  }
  var r = await GEV.sb.auth.signInWithPassword({ email: GEV.emailDoUsuario(usuario), password: senha });
  if (r.error) {
    erroEl.textContent = 'Usuário ou senha incorretos.';
    return;
  }
  await irParaMuralSeLogado();
}

document.getElementById('entrar').onclick = tentarEntrar;
document.getElementById('senha').addEventListener('keydown', function (e) { if (e.key === 'Enter') tentarEntrar(); });

irParaMuralSeLogado();
</script>
</body>
</html>

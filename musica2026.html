<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letras MCJ - Telao</title>
<style>
:root {
  --bg: #1c1108;
  --bg-2: #3f2611;
  --panel: #2a180d;
  --text: #f3e3c4;
  --text-dim: #b89468;
  --accent: #d9a743;
  --accent-2: #9c6b34;
  --border: #4d3319;
  --danger: #c46a3f;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eecf95;
    --bg-2: #f8e7bf;
    --panel: #fdf6e6;
    --text: #3a2313;
    --text-dim: #8a6a3f;
    --accent: #a8712e;
    --accent-2: #6b4423;
    --border: #d9bd85;
  }
}
:root[data-theme="dark"] { }
html, body {
  height: 100%;
  margin: 0;
}
* { box-sizing: border-box; }
body {
  background: radial-gradient(ellipse at top, var(--bg-2), var(--bg));
  color: var(--text);
  font-family: "Georgia", "Iowan Old Style", serif;
  overflow: hidden;
  scroll-padding-top: env(safe-area-inset-top, 0px);
}
#app { height: 100%; width: 100%; position: relative; }

/* ---------- LISTA / BUSCA ---------- */
#listView {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: clamp(16px, 3vw, 40px);
  max-width: 900px;
  margin: 0 auto;
}
.header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: clamp(10px, 2vw, 20px);
}
.header h1 {
  font-size: clamp(20px, 3vw, 32px);
  margin: 0;
  letter-spacing: 0.5px;
  color: var(--accent);
  font-weight: 600;
}
.header .count {
  font-family: system-ui, sans-serif;
  font-size: 14px;
  color: var(--text-dim);
}
#searchBox {
  width: 100%;
  font-size: clamp(15px, 1.6vw, 19px);
  padding: 8px 4px 10px 4px;
  border-radius: 0;
  border: none;
  border-bottom: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  outline: none;
  font-family: "Georgia", "Iowan Old Style", serif;
  font-style: italic;
  letter-spacing: 0.3px;
  transition: border-color 0.2s ease;
}
#searchBox::placeholder { color: var(--text-dim); opacity: 0.75; }
#searchBox:focus { border-bottom-color: var(--accent); }
#songList {
  flex: 1;
  overflow-y: auto;
  margin-top: 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--panel);
}
.songItem {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  font-size: clamp(16px, 2vw, 22px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  transition: background 0.12s ease;
}
.songItem:last-child { border-bottom: none; }
.songItem:hover, .songItem.active {
  background: rgba(217, 167, 67, 0.16);
  background: color-mix(in srgb, var(--accent) 16%, transparent);
}
.songItem .title { font-weight: 600; }
.songItem .idx {
  font-family: system-ui, sans-serif;
  font-size: 13px;
  color: var(--text-dim);
  min-width: 26px;
  text-align: right;
}
#songList .empty {
  padding: 30px;
  text-align: center;
  color: var(--text-dim);
  font-family: system-ui, sans-serif;
}
.hint {
  margin-top: 10px;
  font-family: system-ui, sans-serif;
  font-size: 12px;
  color: var(--text-dim);
  text-align: center;
}
.hint kbd {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 11px;
}

/* ---------- MODO APRESENTACAO ---------- */
#presentView {
  display: none;
  position: absolute;
  inset: 0;
  flex-direction: column;
  padding: clamp(20px, 4vw, 60px);
  padding-top: calc(env(safe-area-inset-top, 0px) + clamp(20px, 4vw, 60px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(20px, 4vw, 60px));
}
#presentView.active { display: flex; }
#presTitle {
  font-size: clamp(16px, 2.2vw, 24px);
  color: var(--accent);
  text-align: center;
  font-weight: 600;
  letter-spacing: 0.5px;
  opacity: 0.85;
  margin-bottom: clamp(10px, 2vh, 20px);
}
#presLines {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: clamp(10px, 2.2vh, 26px);
  padding: 0 clamp(0px, 4vw, 60px);
}
#presLines .line {
  font-size: clamp(28px, 6.2vw, 72px);
  line-height: 1.25;
  font-weight: 500;
  text-shadow: 0 2px 18px rgba(0,0,0,0.25);
}
#presFooter {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: clamp(10px, 2vh, 20px);
}
.dots {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  justify-content: center;
  flex: 1;
}
.dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--border);
  cursor: pointer;
  transition: background 0.15s, transform 0.15s;
}
.dot.on { background: var(--accent); transform: scale(1.3); }
.ctrlBtn {
  font-family: system-ui, sans-serif;
  font-size: 14px;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 14px;
  cursor: pointer;
}
.ctrlBtn:hover { border-color: var(--accent); }
.navArrow {
  font-family: system-ui, sans-serif;
  font-size: clamp(20px, 3vw, 30px);
  background: transparent;
  color: var(--text-dim);
  border: none;
  cursor: pointer;
  padding: 6px 16px;
  user-select: none;
}
.navArrow:hover { color: var(--accent); }
.navZone {
  position: absolute;
  top: 0; bottom: 0;
  width: 18%;
  cursor: pointer;
}
.navZone.left { left: 0; }
.navZone.right { right: 0; }

.topBar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: 14px;
  right: 14px;
  z-index: 5;
}
</style>
</head>
<body>
<div id="app">

  <div id="listView">
    <div class="header">
      <h1>Letras - Momentos com Jesus</h1>
      <span class="count" id="countLabel"></span>
    </div>
    <input id="searchBox" type="text" placeholder="Buscar musica... (nome ou autor)" autocomplete="off" autofocus>
    <div id="songList"></div>
    <div class="hint">Digite para buscar &middot; clique numa musica ou tecle <kbd>Enter</kbd> &middot; <kbd>F11</kbd> para tela cheia</div>
  </div>

  <div id="presentView">
    <div class="topBar">
      <button class="ctrlBtn" id="backBtn">&larr; Buscar (Backspace ou B)</button>
      <button class="ctrlBtn" id="fsBtn">Tela cheia</button>
    </div>
    <div id="presTitle"></div>
    <div id="presLines"></div>
    <div class="navZone left" id="zoneLeft" title="Slide anterior"></div>
    <div class="navZone right" id="zoneRight" title="Proximo slide"></div>
    <div id="presFooter">
      <button class="navArrow" id="prevBtn">&#8592;</button>
      <div class="dots" id="dots"></div>
      <button class="navArrow" id="nextBtn">&#8594;</button>
    </div>
  </div>

</div>

// Chunk lines into readable slides
const LINES_PER_SLIDE = 4;
function chunk(lines, size) {
  const out = [];
  for (let i = 0; i < lines.length; i += size) out.push(lines.slice(i, i + size));
  return out;
}
SONGS.forEach(s => { s.slides = chunk(s.lyrics, LINES_PER_SLIDE); });

function normalize(str) {
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

const listView = document.getElementById('listView');
const presentView = document.getElementById('presentView');
const searchBox = document.getElementById('searchBox');
const songListEl = document.getElementById('songList');
const countLabel = document.getElementById('countLabel');
const presTitle = document.getElementById('presTitle');
const presLines = document.getElementById('presLines');
const dotsEl = document.getElementById('dots');

let filtered = SONGS.map((s, i) => ({ ...s, origIndex: i }));
let activeIdx = 0;
let currentSong = null;
let currentSlide = 0;

function renderList() {
  const q = normalize(searchBox.value.trim());
  filtered = SONGS
    .map((s, i) => ({ ...s, origIndex: i }))
    .filter(s => !q || normalize(s.title).includes(q));
  countLabel.textContent = filtered.length + ' / ' + SONGS.length + ' musicas';
  if (activeIdx >= filtered.length) activeIdx = 0;

  if (filtered.length === 0) {
    songListEl.innerHTML = '<div class="empty">Nenhuma musica encontrada.</div>';
    return;
  }
  songListEl.innerHTML = filtered.map((s, i) => `
    <div class="songItem${i === activeIdx ? ' active' : ''}" data-i="${i}">
      <span class="title">${escapeHtml(s.title)}</span>
      <span class="idx">${s.origIndex + 1}</span>
    </div>
  `).join('');
  [...songListEl.children].forEach(el => {
    el.addEventListener('click', () => openSong(filtered[+el.dataset.i]));
  });
  const activeEl = songListEl.querySelector('.songItem.active');
  if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function openSong(song) {
  currentSong = song;
  currentSlide = 0;
  presTitle.textContent = song.title;
  presTitle.style.cursor = 'pointer';
  presTitle.title = 'Clique para voltar a busca';
  renderSlide();
  listView.style.display = 'none';
  presentView.classList.add('active');
}
presTitle.addEventListener('click', closePresent);

function closePresent() {
  presentView.classList.remove('active');
  listView.style.display = 'flex';
  searchBox.focus();
}

function renderSlide() {
  if (!currentSong) return;
  const slides = currentSong.slides.length ? currentSong.slides : [['(sem letra)']];
  currentSlide = Math.max(0, Math.min(currentSlide, slides.length - 1));
  const lines = slides[currentSlide];
  presLines.innerHTML = lines.map(l => `<div class="line">${escapeHtml(l)}</div>`).join('');
  dotsEl.innerHTML = slides.map((_, i) => `<span class="dot${i === currentSlide ? ' on' : ''}" data-i="${i}"></span>`).join('');
  [...dotsEl.children].forEach(d => d.addEventListener('click', () => { currentSlide = +d.dataset.i; renderSlide(); }));
}

function nextSlide() {
  if (!currentSong) return;
  if (currentSlide < currentSong.slides.length - 1) { currentSlide++; renderSlide(); }
}
function prevSlide() {
  if (!currentSong) return;
  if (currentSlide > 0) { currentSlide--; renderSlide(); }
}

searchBox.addEventListener('input', () => { activeIdx = 0; renderList(); });
searchBox.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, filtered.length - 1); renderList(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); renderList(); }
  else if (e.key === 'Enter') { if (filtered[activeIdx]) openSong(filtered[activeIdx]); }
});

document.getElementById('backBtn').addEventListener('click', closePresent);
document.getElementById('nextBtn').addEventListener('click', nextSlide);
document.getElementById('prevBtn').addEventListener('click', prevSlide);
document.getElementById('zoneLeft').addEventListener('click', prevSlide);
document.getElementById('zoneRight').addEventListener('click', nextSlide);

document.getElementById('fsBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
});

window.addEventListener('keydown', (e) => {
  const isBack = e.key === 'Backspace' || e.code === 'Backspace' || e.keyCode === 8 ||
                 e.key === 'Escape' || e.code === 'Escape' ||
                 e.key === 'b' || e.key === 'B';
  if (presentView.classList.contains('active')) {
    if (e.key === 'ArrowRight' || e.code === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); nextSlide(); }
    else if (e.key === 'ArrowLeft' || e.code === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prevSlide(); }
    else if (isBack) { e.preventDefault(); e.stopPropagation(); closePresent(); }
    else if (e.key === 'f' || e.key === 'F11') { /* let browser or fsBtn handle */ }
  } else {
    if (e.key === '/' ) { e.preventDefault(); searchBox.focus(); }
  }
}, true);

renderList();
</script>
